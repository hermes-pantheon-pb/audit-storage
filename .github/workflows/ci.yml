name: CI / Storage Auditor Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify CLI Help & Options
        run: |
          python -m py_compile audit_storage.py test_audit_storage.py
          python audit_storage.py --help

      - name: Run Test Suite
        run: |
          python -m unittest test_audit_storage.py -v
